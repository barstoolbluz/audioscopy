[package]
name = "audioscopy"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Audio measurements computed from decoded PCM samples"
license = "GPL-2.0-or-later"
repository = "https://github.com/barstoolbluz/audioscopy"
readme = "README.md"
keywords = ["audio", "analysis", "measurement", "dsp"]
categories = ["multimedia::audio"]

[dependencies]
# Cargo uses the sibling during local development and the registry version
# after publication. Publish true-peak 0.1.0 first.
true-peak = { version = "=0.1.0", path = "../true-peak" }
rustfft = "=6.4.1"
