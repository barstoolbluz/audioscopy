[package]
name = "audioscopy"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Audio measurements computed from decoded PCM samples"
license = "GPL-2.0-or-later"
repository = "https://github.com/barstoolbluz/audioscopy"
readme = "README.md"
keywords = ["audio", "analysis", "measurement", "dsp"]
categories = ["multimedia::audio"]

[features]
# On by default; opt out with default-features = false and list the
# features you want.
#
# Binary64 speed-ups. Both give byte-identical measurement records to the
# scalar path and select their ISA at run time; the NEON path is compiled
# only on AArch64.
#
# Precision interfaces (audioscopy::precision): double-double on every
# target, and genuine x87 extended80 on native x86_64-unknown-linux-gnu
# builds. The native C11 kernels need a C compiler (cc) when the target is
# a supported native GNU/Linux or Apple target; elsewhere, and when cross
# compiling, they are not built and those backends report unavailable.
# The ordinary Analyzer does not use these interfaces.
default = [
    "experimental-stereo-spectrum-split",
    "experimental-loudness-neon",
    "precision-x87",
    "precision-spectrum",
    "precision-loudness",
]
# Opt-in qualification candidates.
experimental-spectral-avx2 = []
experimental-spectral-avx512 = []
experimental-stereo-spectrum-split = []
experimental-loudness-neon = ["true-peak/experimental-loudness-neon"]
# Optional high-precision correlation. The ordinary analyzer is unchanged.
precision = []
precision-x87 = ["precision"]
# Optional end-to-end wide average spectrum (native C11 kernel).
precision-spectrum = ["precision"]
# Optional wider native-profile integrated loudness.
precision-loudness = ["precision"]

[dependencies]
# Cargo uses the sibling during local development and the registry version
# after publication. Publish true-peak 0.1.0 first.
true-peak = { version = "=0.1.0", path = "../true-peak" }
rustfft = "=6.4.1"
